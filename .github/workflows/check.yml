name: Check MCP
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:ask-page
      - run: git diff --exit-code -- src/ask-page/bundle.js src/ask-page/compiled.css src/ask-page/properties.css
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
