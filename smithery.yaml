# Smithery deployment config.
#
# The server is a plain Node HTTP MCP server (server.mjs, streamable-http on
# :3000) and ships with a Dockerfile, so Smithery builds and runs the container
# rather than a language-specific runtime.
#
# ON CONFIG: there are no required install-time parameters. Every tool acts for
# a connected Apiosk account, so hosted clients are onboarded by OAuth when they
# connect. Data requests go to Gateway v2 (https://gateway.apiosk.com).

runtime: container

build:
  dockerfile: Dockerfile
  dockerBuildPath: .

startCommand:
  type: http
  # Every field is optional; hosted users connect through OAuth.
  configSchema:
    type: object
    required: []
    properties:
      APIOSK_CONNECT_TOKEN:
        type: string
        title: Apiosk agent token
        description: >-
          Optional. An Apiosk agent token (apk_access_… or a legacy apk_live_…
          agent key) for self-hosted or staging use. Hosted users connect with
          OAuth instead.
      APIOSK_GATEWAY_V2_URL:
        type: string
        title: Gateway v2 URL
        default: https://gateway.apiosk.com
        description: >-
          Optional. Point the server at a different Apiosk Gateway v2. Leave
          unset unless you are testing against staging.
  exampleConfig: {}
