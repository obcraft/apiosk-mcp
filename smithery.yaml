# Smithery deployment config.
#
# The server is a plain Node HTTP MCP server (server.mjs, streamable-http on
# :3000) and ships with a Dockerfile, so Smithery builds and runs the container
# rather than a language-specific runtime.
#
# ON CONFIG: there are no required install-time parameters. Hosted clients are
# onboarded by OAuth on the first provider-data call (`apiosk`, discover or
# compare); execute and approval status use that same connection. A manually
# supplied Connect token remains available for self-hosted or staging use.

runtime: container

build:
  dockerfile: Dockerfile
  dockerBuildPath: .

startCommand:
  type: http
  # Every field is optional; hosted users connect through OAuth on first use.
  configSchema:
    type: object
    required: []
    properties:
      APIOSK_CONNECT_TOKEN:
        type: string
        title: Apiosk connect token
        description: >-
          Optional. A token minted at buy.apiosk.com, naming the wallet and the
          spending policy this server may buy under. Hosted users normally use
          OAuth instead; all provider-data and execution tools require a
          connected account.
      APIOSK_GATEWAY_URL:
        type: string
        title: Gateway base URL
        default: https://gateway.apiosk.com
        description: >-
          Optional. Point the server at a different Apiosk gateway. Leave unset
          unless you are testing against staging.
  exampleConfig: {}
